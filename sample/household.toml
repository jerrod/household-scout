# Every source sorts items into these areas. `kinds` splits an area further. `vault = true` files the area's attachments in the encrypted vault.
[areas]
health = { about = "Medical, dental, vision, pharmacy and therapy.", access = "adults", vault = true, kinds = { appointment = "A medical or dental appointment.", bill_claim = "A medical bill or insurance claim.", lab_result = "A lab or test result.", prescription = "A pharmacy or prescription notice.", vaccination_record = "Immunization or vaccination record." } }
school = { about = "Classes, grades, assignments, teachers, school events and fees.", access = "everyone", kinds = { grades = "Grades, report cards or progress reports.", assignments = "Homework, assignments, projects or tests.", attendance = "Absences, tardies or attendance notices.", teacher_message = "A message from a teacher or counselor.", schedule_calendar = "Class schedule, school calendar or early release.", fees_forms = "Fees, permission slips, registration or forms." } }
activities = { about = "Sports, camps, lessons, clubs and outings.", access = "everyone" }
calendar = { about = "A family plan or date that fits no other area.", access = "everyone" }
travel = { about = "Trips, flights, hotels and rentals.", access = "everyone" }
dining = { about = "Restaurants, recipes and groceries.", access = "everyone" }
home = { about = "The house, yard, repairs, contractors, utilities, appliances and vehicles.", access = "everyone", kinds = { contractor_work = "Invoice, estimate or appointment from a contractor or trade.", appliance = "Purchase, warranty, manual or service for an appliance.", utilities = "Electric, gas, water, sewer, trash or internet service.", hoa = "Homeowners association dues, rules or requests.", vehicle = "Buying, servicing, registering or insuring a vehicle." } }
purchases = { about = "Orders, returns and things bought.", access = "adults" }
finance = { about = "Banks, cards, bills, loans, investments and pay.", access = "adults", vault = true, kinds = { bank_statement = "A bank account statement or alert.", credit_card = "A credit card statement or alert.", loan_mortgage = "A mortgage or loan statement.", investment = "A brokerage or retirement statement.", payroll_benefits = "Pay stubs or employee benefits.", subscription = "A recurring subscription charge." } }
taxes = { about = "Tax returns, forms and accountants.", access = "adults" }
insurance = { about = "Policies, coverage, renewals and claims.", access = "adults" }
legal = { about = "Wills, powers of attorney, guardianship and beneficiaries.", access = "adults", vault = true }
civic = { about = "IDs, voting, jury duty and government notices.", access = "adults", vault = true }
care = { about = "Nannies, sitters, tutors, eldercare and custody schedules.", access = "adults" }
emergency = { about = "Emergency contacts, shutoffs, medications and plans.", access = "everyone" }
pets = { about = "Pet care, vets and pet supplies.", access = "everyone" }
job = { about = "Paid work: employers, clients, meetings and contracts.", access = "adults" }

[records]
extra = []

[sources.mail]
reader = "apple_mail"

[sources.messages]
reader = "apple_messages"

[sources.calendar]
reader = "apple_calendar"
skip = ["Holidays", "Birthdays"]

[sources.canvas]
host = "https://example.instructure.com"
first_sync = "2026-08-01T00:00:00Z"
students = { Riley = "riley-canvas-token", Jordan = "jordan-canvas-token" }

[sources.slack]
thread_days = 30

[sources.intake]
server = "https://kb.example.com"

[sources.infinite_campus]
host = "https://example.infinitecampus.org/campus/"
app_name = "example"


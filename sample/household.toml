finance = { about = "Banks, cards, bills, loans, investments and pay.", access = "adults" }
taxes = { about = "Tax returns, forms and accountants.", access = "adults" }
insurance = { about = "Policies, coverage, renewals and claims.", access = "adults" }
legal = { about = "Wills, powers of attorney, guardianship and beneficiaries.", access = "adults" }

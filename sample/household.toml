school = { about = "Classes, grades, assignments, teachers, school events and fees.", access = "everyone" }
activities = { about = "Sports, camps, lessons, clubs and outings.", access = "everyone" }
calendar = { about = "A family plan or date that fits no other area.", access = "everyone" }
travel = { about = "Trips, flights, hotels and rentals.", access = "everyone" }
